name: Daily 06:00 Knowledge Combo pack v2

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional KST target date (YYYY-MM-DD). Empty = today in Korea."
        required: false
        type: string
  schedule:
    - cron: '0 6 * * *'
      timezone: 'Asia/Seoul'

permissions:
  contents: write

concurrency:
  group: daily-knowledge-combo-pack-v2
  cancel-in-progress: false

jobs:
  generate-validate-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INPUT_TARGET_DATE: ${{ github.event.inputs.target_date }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve KST target date
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TARGET_DATE:-}" ]; then
            TARGET="$INPUT_TARGET_DATE"
          else
            TARGET="$(TZ=Asia/Seoul date +%F)"
          fi
          python3 -c "import datetime; datetime.date.fromisoformat('$TARGET')"
          echo "TARGET_DATE=$TARGET" >> "$GITHUB_ENV"
          echo "Target date: $TARGET"

      - name: Generate and validate
        shell: bash
        run: |
          set -euo pipefail

          PACK="daily_knowledge_combo_${TARGET_DATE//-/}_2700.json"

          # Record whether today's dated pack already existed before this run.
          if [ -f "$PACK" ]; then
            PREEXISTING=1
          else
            PREEXISTING=0
          fi

          set +e
          python3 .github/workflows/KnowledgeCombo_generate_daily.py --date "$TARGET_DATE" --root .
          RC=$?
          set -e

          if [ "$RC" -eq 0 ]; then
            exit 0
          fi

          # Newly generated packs must pass every validator. No exceptions.
          if [ "$PREEXISTING" -ne 1 ]; then
            echo "Validation failed for a newly generated pack; refusing commit."
            exit "$RC"
          fi

          # Existing same-day legacy pack:
          # allow ONLY historical duplicate source-combination metadata failure.
          # Every structural/content check must still be PASS.
          python3 - "$TARGET_DATE" "$PACK" <<'PY'
          import json
          import pathlib
          import sys
          from collections import Counter

          target = sys.argv[1]
          pack_name = sys.argv[2]
          report_path = pathlib.Path("AUTO_VALIDATION_REPORT.json")
          pack_path = pathlib.Path(pack_name)

          if not report_path.exists():
              raise SystemExit("Validation report missing")
          if not pack_path.exists():
              raise SystemExit("Existing dated pack missing")

          report = json.loads(report_path.read_text(encoding="utf-8"))
          failed = [
              c.get("name")
              for c in report.get("checks", [])
              if not c.get("pass")
          ]

          if failed != ["unique_source_combos"]:
              raise SystemExit(f"Unexpected validation failures: {failed}")

          if report.get("date") != target:
              raise SystemExit("Validation report date mismatch")

          checks = {
              c.get("name"): bool(c.get("pass"))
              for c in report.get("checks", [])
          }
          required_pass = [
              "total_2700",
              "36_topics_x75",
              "5_difficulties_x540",
              "180_cells_x15",
              "unique_ids",
              "unique_questions",
              "four_choices",
              "answer_in_choices",
              "accepted_answer",
              "source_count_matches_level",
              "pack_date",
              "pack_counts",
              "manifest_entry",
              "manifest_date",
              "manifest_cumulative",
          ]
          missing_or_failed = [n for n in required_pass if not checks.get(n)]
          if missing_or_failed:
              raise SystemExit(
                  f"Required legacy safety checks failed/missing: {missing_or_failed}"
              )

          pack = json.loads(pack_path.read_text(encoding="utf-8"))
          questions = pack.get("questions", [])
          if pack.get("date") != target:
              raise SystemExit("Legacy pack date mismatch")
          if len(questions) != 2700:
              raise SystemExit("Legacy pack question count mismatch")

          topic_counts = Counter(q.get("topic") for q in questions)
          if len(topic_counts) != 36 or any(v != 75 for v in topic_counts.values()):
              raise SystemExit(f"Legacy topic distribution mismatch: {topic_counts}")

          diff_counts = Counter(q.get("difficulty") for q in questions)
          if set(diff_counts.values()) != {540} or len(diff_counts) != 5:
              raise SystemExit(f"Legacy difficulty distribution mismatch: {diff_counts}")

          cell_counts = Counter(
              (q.get("topic"), q.get("difficulty")) for q in questions
          )
          if len(cell_counts) != 180 or any(v != 15 for v in cell_counts.values()):
              raise SystemExit("Legacy topic/difficulty cell distribution mismatch")

          report["status"] = "PASS_LEGACY_PRESERVE"
          report["legacyPreserve"] = True
          report["legacyPreserveReason"] = (
              "Dated pack existed before workflow start. All structural/content "
              "checks passed; only historical source-combination uniqueness metadata "
              "was waived for this pre-existing pack."
          )
          report_path.write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("Legacy same-day Knowledge Combo pack accepted after strict safety checks.")
          PY

      - name: Commit and push verified data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            manifest.json \
            daily_knowledge_combo_*_2700.json \
            AUTO_VALIDATION_REPORT.json

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "data: auto update Knowledge Combo $TARGET_DATE"
          git pull --rebase origin main
          git push origin HEAD:main
